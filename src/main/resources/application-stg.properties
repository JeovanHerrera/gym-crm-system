#Application port
server.port=8081

#JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

#MYSQL config
spring.datasource.url=jdbc:mysql://rds-instance.cpyoq6u4sv4w.us-east-2.rds.amazonaws.com:3306/gymcrmsystem
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.data-locations=classpath:data-local.sql

#ActiveMQ Config
spring.activemq.broker-url=tcp://activemq:61616
spring.activemq.user=artemis
spring.activemq.password=artemis
spring.activemq.packages.trust-all=true