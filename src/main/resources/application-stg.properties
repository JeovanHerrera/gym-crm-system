#Application port
server.port=8081

#JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

#MYSQL config
spring.datasource.url=jdbc:mysql://rds-instance.cpyoq6u4sv4w.us-east-2.rds.amazonaws.com:3306/gymcrmsystem
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.data-locations=classpath:data-local.sql

#AWS SQS
spring.cloud.aws.region.static=us-east-2
spring.cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secretKey=${AWS_SECRET_ACCESS_KEY}
spring.cloud.aws.credentials.instanceProfile=false
spring.cloud.aws.stack.auto=false
spring.cloud.aws.sqs.endpoint=${AWS_SQS_ENDPOINT_ID}