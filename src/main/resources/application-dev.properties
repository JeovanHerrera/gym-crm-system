#Application port
server.port=8083

#Resources config
data.file.path=src/main/resources/Entities.json

#JPA config
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

#H2 config
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:gymcrmsystem;NON_KEYWORDS=user
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.sql.init.data-locations=classpath:data-dev.sql

#Eureka Config
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.preferIPAddress=true

#ActiveMQ Config
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=artemis
spring.activemq.password=artemis
spring.activemq.packages.trust-all=true

#AWS SQS
spring.cloud.aws.region.static=us-east-2
spring.cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secretKey=${AWS_SECRET_ACCESS_KEY}
spring.cloud.aws.credentials.instanceProfile=false
spring.cloud.aws.stack.auto=false