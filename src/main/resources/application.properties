
data.file.path=src/main/resources/Entities.json

spring.application.name=gym-crm-application
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/gymcrmsystem
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.profiles.active=local

#Actuator config
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,metrics,prometheus
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

#CORS origin
cors.origin.url=http://localhost:3000

# JWT config
gym-crm-system.jwt.issuer=gym-crm-system
gym-crm-system.jwt.secret=#1234
gym-crm-system.jwt.expiration-in-milliseconds=86400000

#Eureka Config
eureka.client.serviceUrl.default-zone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.preferIPAddress=true

#CircuitBreaker
resilience4j.circuitbreaker.instances.TrainingScheduleBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.TrainingScheduleBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.TrainingScheduleBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.TrainingScheduleBreaker.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.TrainingScheduleBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.TrainingScheduleBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.TrainingScheduleBreaker.sliding-window-type=count_based
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true

#Logger
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:%5p} ${PID:- } --- [%15.15t] %-40.40logger{39} : %m ${LOG_EXCEPTION_CONVERSION_WORD:-%wEx} %X{transaction.id}%n